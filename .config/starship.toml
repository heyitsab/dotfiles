# ~/.config/starship.toml
# Starship prompt configuration

# Minimal prompt format - just directory, git, and prompt character
format = """
$directory\
$git_branch\
$git_status\
$character"""

# Don't add a new line before the prompt
add_newline = false

[character]
# Success: green arrow, Failure: red arrow
success_symbol = "[❯](bold #b8bb26)"  # Gruvbox green
error_symbol = "[❯](bold #fb4934)"    # Gruvbox red

[directory]
style = "bold #fabd2f"  # Gruvbox yellow
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "bold #83a598"  # Gruvbox blue
format = "[$symbol$branch]($style) "

[git_status]
# Show status with emojis
format = "([$all_status$ahead_behind]($style) )"
style = "bold #fe8019"  # Gruvbox orange

# Emoji indicators
modified = "🟠"      # Modified files
staged = "🟢"        # Staged files  
untracked = "❓"     # Untracked files
deleted = "🗑️"       # Deleted files
renamed = "👯‍"       # Renamed files
conflicted = "💔"    # Merge conflicts

# Ahead/behind indicators
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# Disable modules you don't need (keeps it fast and minimal)
[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[ruby]
disabled = true

[package]
disabled = true

[cmd_duration]
disabled = true
