# ~/.config/tmux/tmux.conf - Simple, modern tmux config

# Use Ctrl-s as prefix (easier to reach than Ctrl-b)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config easily
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Better split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes easily (prefix + arrow keys)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Alternative: resize with H J K L (vim-style)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim-tmux-navigator
# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Vi mode for copy/paste
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Easier copy mode entry
bind [ copy-mode
bind ] paste-buffer

# Mouse support
set -g mouse on

# Fix mouse mode after sleep (prefix + m to reset)
bind m run-shell "printf '\\e[?1000l\\e[?1002l\\e[?1003l\\e[?1006l'" \; display "Mouse reset!"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Quick window switching (Alt+number, no prefix needed!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick window navigation (Alt+arrows, no prefix!)
bind -n M-Left previous-window
bind -n M-Right next-window

# Enable true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer
set -g history-limit 10000

# Status bar styling (more visible with colored background)
set -g status-style bg=colour235,fg=colour250
set -g status-left-length 40
set -g status-left "#[fg=colour76,bg=colour235,bold] ❐ #S #[fg=colour244]│ "
set -g status-right "#[fg=colour244]│ #[fg=colour111]%d %b #[fg=colour250]%H:%M "

# Window status styling
setw -g window-status-format "#[fg=colour244] #I:#W "
setw -g window-status-current-format "#[fg=colour16,bg=colour111,bold] #I:#W "
setw -g window-status-separator ""
